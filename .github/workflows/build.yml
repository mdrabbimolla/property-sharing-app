name: Build Property Sharing APK

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-22.04
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install Android build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            build-essential ccache git zip unzip openjdk-17-jdk \
            autoconf libtool pkg-config zlib1g-dev libncurses5-dev \
            libncursesw5-dev cmake libffi-dev libssl-dev

      - name: Install Buildozer
        run: |
          python -m pip install --upgrade pip
          python -m pip install buildozer "cython==0.29.36"

      - name: Build APK
        shell: bash
        env:
          PIP_CONSTRAINT: ${{ github.workspace }}/pip-constraints.txt
        run: |
          # Explicitly use JDK 17; Buildozer/runner otherwise may select JDK 11.
          export JAVA_HOME="$JAVA_HOME_17_X64"
          export PATH="$JAVA_HOME/bin:$PATH"
          java -version
          # Remove partial build environments left by failed attempts.
          rm -rf .buildozer bin
          # 'yes' can exit with SIGPIPE after Buildozer has already created the APK.
          # Accept that harmless pipeline status only when a non-empty APK exists.
          set +e
          yes | buildozer android debug
          build_status=$?
          set -e
          apk="$(find bin -maxdepth 1 -name '*.apk' -size +0c -print -quit)"
          if [ -z "$apk" ]; then
            echo "Build failed (pipeline exit $build_status) and no APK was produced."
            exit 1
          fi
          echo "Verified APK output: $apk"
          ls -lh "$apk"

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: property-sharing-apk
          path: bin/*.apk
          if-no-files-found: error
